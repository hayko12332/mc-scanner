<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 64 64">
  <!-- LeadHaul: a road running to the horizon, with the new lead (orange) waiting there. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16295a"/>
      <stop offset="1" stop-color="#070d1c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.24" r="0.34">
      <stop offset="0" stop-color="#f97316" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lead" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fdba74"/>
      <stop offset="1" stop-color="#ea580c"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" fill="url(#bg)"/>
  <rect width="64" height="64" fill="url(#glow)"/>
  <!-- Kept inside the central circle that Telegram crops avatars to. -->
  <g transform="translate(32 33) scale(0.9) translate(-32 -33)">
    <path d="M14 54 28 22M50 54 36 22" fill="none" stroke="#fff" stroke-width="5.5" stroke-linecap="round"/>
    <path d="M32 50v-5M32 39v-4M32 30v-2" fill="none" stroke="#60a5fa" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="32" cy="15" r="5.5" fill="url(#lead)"/>
  </g>
</svg>
