services:
  - type: web
    name: mc-scanner
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm run setup && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: SAFER_RPS
        value: "1.5"
      - key: SOCRATA_APP_TOKEN
        sync: false
